name: daily-jobs

# 求人パイプライン。Reddit側のブロック問題とは無関係に独立して動く。

on:
  schedule:
    - cron: "30 21 * * *"   # UTC 21:30 = JST 06:30。daily-voicesと時間をずらす
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch, summarize, write
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit if changed
        run: |
          git config user.name  "chillmeru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 求人 日次更新 $(date -u +%Y-%m-%d)"
            git push
          fi
