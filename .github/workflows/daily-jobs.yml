name: daily-jobs

# 求人パイプライン。Reddit側のブロック問題とは無関係に独立して動く。

on:
  # GitHubのスケジュール実行は数時間ずれ込むことがあり（実測で3〜8時間）、
  # 21:30 UTC 指定だと実際には UTC 00:56〜05:31＝中国時間の日中に走っていた。
  # GLM(bigmodel.cn)の無料枠はその時間帯に混雑して429になるため、
  # 遅延しても中国時間の深夜(UTC 16-22時台)に収まるよう早めに寄せてある。
  # ラウンドな分は混みやすいので :23 にしている。
  schedule:
    - cron: "23 16 * * *"   # UTC 16:23 = JST 01:23 = 中国 00:23
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch, summarize, write
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node scripts/fetch-jobs.mjs

      - name: Commit if changed
        run: |
          git config user.name  "chillmeru-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: 求人 日次更新 $(date -u +%Y-%m-%d)"
            git push
          fi
